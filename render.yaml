services:
  # 1. ニュース巡回・自動配信 Cron Job (15分おきに巡回実行)
  - type: cron
    name: kick-news-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python3 main.py --once
    schedule: "*/15 * * * *"

  # 2. 試合スケジュール自動配信 Cron Job (毎週月曜日 朝8時 JST に配信)
  # RenderのCron ScheduleはUTC（協定世界時）基準です。
  # 日曜日 23:00 UTC ＝ 日本時間(JST) 月曜日 08:00
  - type: cron
    name: kick-schedule-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python3 main.py --schedule
    schedule: "0 23 * * 0"
