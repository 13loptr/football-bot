name: Soccer News & Schedule Bot Automation

on:
  schedule:
    # 1. ニュース自動巡回・配信: 15分おき (UTC)
    - cron: '*/15 * * * *'
    # 2. 試合スケジュール自動配信: 毎週月曜日 朝8時 JST (日曜日 23:00 UTC)
    - cron: '0 23 * * 0'
  workflow_dispatch:

jobs:
  # ジョブ1: 15分おきのニュース巡回配信 (--once)
  news-bot:
    name: News Bot (--once)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *' || github.event.schedule != '0 23 * * 0'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Soccer News Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          WEBHOOK_TRANSFERS: ${{ secrets.WEBHOOK_TRANSFERS }}
          WEBHOOK_JAPANESE: ${{ secrets.WEBHOOK_JAPANESE }}
          WEBHOOK_NATIONAL: ${{ secrets.WEBHOOK_NATIONAL }}
          WEBHOOK_LALIGA: ${{ secrets.WEBHOOK_LALIGA }}
          WEBHOOK_PREMIER: ${{ secrets.WEBHOOK_PREMIER }}
          WEBHOOK_BUNDESLIGA: ${{ secrets.WEBHOOK_BUNDESLIGA }}
          WEBHOOK_SERIE_A: ${{ secrets.WEBHOOK_SERIE_A }}
          WEBHOOK_LIGUE_1: ${{ secrets.WEBHOOK_LIGUE_1 }}
          WEBHOOK_GENERAL: ${{ secrets.WEBHOOK_GENERAL }}
          WEBHOOK_LINEUP: ${{ secrets.WEBHOOK_LINEUP }}
        run: python3 main.py --once

  # ジョブ2: 毎週月曜朝8時 JST (日曜23:00 UTC) の試合スケジュール配信 (--schedule)
  schedule-bot:
    name: Match Schedule Bot (--schedule)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 23 * * 0'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Match Schedule Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          WEBHOOK_SCHEDULE: ${{ secrets.WEBHOOK_SCHEDULE }}
        run: python3 main.py --schedule
