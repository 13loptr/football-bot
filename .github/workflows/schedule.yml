name: Soccer News & Schedule Bot Automation

on:
  schedule:
    # 1. ニュース自動巡回・配信: 15分おき (UTC)
    - cron: '*/15 * * * *'
    # 2. 試合スケジュール自動配信: 毎週月曜日 朝8時 JST (日曜日 23:00 UTC)
    - cron: '0 23 * * 0'
  workflow_dispatch:

jobs:
  # ジョブ1: 15分おきのニュース巡回配信 (--once)
  news-bot:
    name: News Bot (--once)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *' || github.event.schedule != '0 23 * * 0'
    
    # ★リポジトリへの書き込み権限を付与★
    permissions:
      contents: write
      
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Soccer News Bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          WEBHOOK_TRANSFERS: ${{ secrets.WEBHOOK_TRANSFERS }}
          WEBHOOK_JAPANESE: ${{ secrets.WEBHOOK_JAPANESE }}
          WEBHOOK_NATIONAL: ${{ secrets.WEBHOOK_NATIONAL }}
          WEBHOOK_LALIGA: ${{ secrets.WEBHOOK_LALIGA }}
          WEBHOOK_PREMIER: ${{ secrets.WEBHOOK_PREMIER }}
          WEBHOOK_BUNDESLIGA: ${{ secrets.WEBHOOK_BUNDESLIGA }}
          WEBHOOK_SERIE_A: ${{ secrets.WEBHOOK_SERIE_A }}
          WEBHOOK_LIGUE_1: ${{ secrets.WEBHOOK_LIGUE_1 }}
          WEBHOOK_GENERAL: ${{ secrets.WEBHOOK_GENERAL }}
          WEBHOOK_LINEUP: ${{ secrets.WEBHOOK_LINEUP }}
          # ★ Threads用のSecretを追加 ★
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python3 main.py --once

      # ★ 更新された履歴とバッファを自動保存（コミット＆プッシュ）するステップを追加 ★
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add sent_history.json lineup_history.json threads_buffer.json || true
          git commit -m "Auto-update history and threads buffer" || echo "No changes to commit"
          git push

  # ジョブ2: 毎週月曜朝8時 JST (日曜23:00 UTC) の試合スケジュール配信 (--schedule)
  schedule-bot:
    name: Match Schedule Bot (--schedule)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispat